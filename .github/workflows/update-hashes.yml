name: Auto Calculate SHA256 Hashes

on:
  push:
    branches:
      - main
    paths:
      - 'update.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-hashes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Calculate & Update SHA256 Hashes
        run: python scripts/update_hashes.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if [[ -n $(git status --porcelain) ]]; then
            git add update.txt
            git commit -m "Auto-update SHA256 hashes [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
